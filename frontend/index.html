<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070c25" />
    <meta
      name="description"
      content="A little vocabulary practice, a shared moment. Join Vocabulary Live."
    />
    <link rel="icon" type="image/png" href="/art/brand.png" />
    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Vocabulary Live</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app">
      <main class="boot-status panel" aria-label="Vocabulary Live">
        <p id="boot-message" role="status">Loading Vocabulary Live…</p>
        <button id="boot-retry" type="button" class="button primary" hidden>
          Try again
        </button>
        <noscript
          >Enable JavaScript to join a practice and recover your
          answers.</noscript
        >
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
